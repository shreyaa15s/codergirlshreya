<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#150029"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="220" fill="url(#bgGrad)"/>
  <g opacity="0.5">
    <circle cx="80" cy="40" r="1.5" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="80" r="1" fill="#818cf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="30" r="1.5" fill="#e879f9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="1" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="100" r="1.2" fill="#818cf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="0" y1="30" x2="1000" y2="30" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="190" x2="1000" y2="190" stroke="#818cf8" stroke-width="0.5" opacity="0.15"/>
  <text x="500" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">SHREYA SHARMA</text>
  <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#c4b5fd" letter-spacing="3">AI/ML ENTHUSIAST • FULL STACK DEVELOPER</text>
  <text x="500" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#a78bfa" opacity="0.8" font-style="italic">Building the future with code 💜</text>
</svg>
