<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="140" fill="url(#holoGlow)"/>
  <circle cx="150" cy="150" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6" stroke-dasharray="10 6">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="90" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="70" fill="#150029" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
  <text x="150" y="145" text-anchor="middle" font-family="Segoe UI" font-size="34" fill="#e879f9" font-weight="700">SS</text>
  <text x="150" y="168" text-anchor="middle" font-family="Segoe UI" font-size="10" fill="#c4b5fd" letter-spacing="2">DEVELOPER</text>
  <rect x="40" y="149" width="220" height="2" fill="#c084fc" opacity="0.7">
    <animate attributeName="y" values="40;260;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
